name: Keep Supabase Alive

on:
  schedule:
    # Yeh har 3 din mein ek baar automatic chalega
    - cron: '0 0 */3 * *' 
  workflow_dispatch: # Isse aap manually bhi test kar sakte ho

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
